<!DOCTYPE html>
    <html>
        <head>
            <title>мій шлях у програмуванні</title>
            <meta name="viewport"
            content="width=device-width,
             initial-scale=1.0">
       <style>
        body{font-family: arial,sans-serif;
            background-color:#851b1b;
        text-align: center;
    padding: 50px;
}
    h1{
        color: #10bce7;
        text-shadow:
         1px 1px 0 black,
         -1px -1px 0 black,
         1px -1px 0 black,
         -1px 1px 0 black;
    }
    p{
        color: #ad1963;
      font-size: 18px;
      text-shadow: 2px 2px 0 black,
      -1px -1px 0 black,
      1px -1px 0 black,
      -1px 1px 0 black;
     }
    img{width: 500px;
    border-radius: 20px;
box-shadow: 0 10px 25px 
rgba(0, 0, 0, 0.5);
display: block;
margin:0 auto 20px auto;
transition: transform 0.3s ease, box-shadow 0.3s ease;}
img:hover {
    transform: scale(1.1);
    box-shadow: 0 15px 35px
    rgba(0, 0, 0, 0.7);
    cursor: pointer;
}
.my-button{
    display: inline-block;
    padding: 12px 25px;
    background-color: #10bce7;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 12px;
    box-shadow: 0 5px 15px 
    rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    margin-top: 20px;
}
.my-button:hover{
    background-color: #0da4c2;
    transform: scale(1.05);
    box-shadow: 0 8px 20px
    rgba(0, 0, 0, 0.5);
    cursor: pointer;
}
    .video-container{
        position: fixed;
        top:0;
        left:0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        margin: 0;
        z-index: 9999;
        background-color: rgba(0, 0, 0, 0.8);
    }
    .video-container video {
        width: 100%;
         height: 100%;
         object-fit: contain;
         border-radius: 0;
         display: block;
         box-shadow: 0 5px 15px
         rgba(0, 0, 0, 0.4);
    }
    .close-video {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10000;
        padding: 10px 18px;
        background-color: #10bce7;
        font-size: 30px;
        font-weight: bold;
        color: white;
        background: none;
        border: none;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    }
    @media  (max-width:600px) {
        body {
            padding: 15px;
        }
        h1 {
            font-size: 28px;
        }
        p {
            font-size: 16px;
        }
         img {
            width: 100%;
            max-width: 500px;
         }
         .my-button {
            display: block;
            width: auto;
            margin: 15px auto;
         }
    }
       </style>
        </head>
        <script>
            function showMessage(){
                document.getElementById("message")
                .innerText= "Ти на правильному шляху🐱‍🏍"
            }
        </script>
        <script>
            let currentColor = 0;
            function changeBackground(){
                //масив кольорів
                const colors = ["#851b1b", "#10bce7", "#ad1963", "#0da4c2","#f4d03f"];
                //обираємо випадковий
               currentColor++;
               if (currentColor >=
                colors.length) {
                    currentColor = 0;
                }
                let randomColor = colors[currentColor];
            // міняємо фон body
            document.body.style.backgroundColor=randomColor;
            }
        </script>
        <script>
            function showGojo(){
            const container =
                document.getElementById("gojoVideo");
                const video = 
                container.querySelector("video");
                container.style.display = "block";
                video.currentTime = 0;
                video.play();
                video.onended = function() {
                    container.style.display = "none";
                };
            }
            function closeGojo(){
                const container =
                document.getElementById("gojoVideo");
                const video = 
                container.querySelector("video");
                video.pause();
                video.currentTime = 0;
                container.style.display = "none";
            }
            document.addEventListener("keydown", function(event) {
                const container = document.getElementById("gojoVideo");
                if
                (container.style.display === "block") {
                    if (event.key === "Space"|| event.code === " Escape") {
                        event.preventDefault();
                        closeGojo();
                    }
                }
            });
        </script>
        <body>
            <h1>привіт світ</h1>
            <p>я вчуся програмувати😁😒</p>
            <div id="gojoVideo"
            class="video-container"
            style="display: none;">
            <button class="close-video"
            onclick="closeGojo()">&times;</button>
            <video width="100%" controls>
            <source src="gojo.mp4"
        type="video/mp4">
            </video>
        </div>

            <img src="https://www.udacity.com/blog/wp-content/uploads/2021/01/Become-a-full-stack-web-developer_Blog-scaled.jpeg"
            alt="майбутнє">
            <a href="#" class="my-button" onclick="showMessage()">я стану веб розробницею!</a>
            <a href="#" class="my-button" onclick="changeBackground()"> змінити фон сайту 🎨</a>
            <a href="javascript:void(0)" class="my-button" onclick="showGojo()">Я обираю Ґоджо Сатору</a>
            <p id="message"></p>
        </body>
    </html>
